name: Publish to npm

# Fork note: upstream auto-publishes on every master push once tests pass.
# In this fork publishing is manual-only so nothing is released by accident.
# Requires an NPM_TOKEN repository secret with publish rights on the
# @wizzboy55 scope (or run `npm publish` locally instead).
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run dist
      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "v${VERSION}" --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
